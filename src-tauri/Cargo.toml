[package]
name = "mtgatool-desktop"
version = "6.7.5"
description = "MTG Arena Tool Desktop"
authors = ["MTG Arena Tool"]
license = "MIT"
repository = "https://github.com/mtgatool/mtgatool-desktop"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "5.2"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
mtga-reader = { path = "../../mtga-reader", default-features = false }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dev builds: light debug info for our crate, none for dependencies.
# Debuginfo/PDBs dominate target/ size; trimming them keeps the disk footprint
# small (important on a near-full drive) and sidesteps PDB write issues.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
